    <text x="142.77" y="346.32" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central" transform="rotate(386.25, 142.77, 346.32)">V</text>
    <text x="186.88" y="360.23" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central" transform="rotate(368.75, 186.88, 360.23)">G</text>
    <text x="210.00" y="362.00" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central" transform="rotate(360.00, 210.00, 362.00)">A</text>
