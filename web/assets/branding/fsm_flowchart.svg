<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 244" width="940" height="244">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      .frame-border {
        fill: #0c0d0e;
        stroke: #ffffff;
        stroke-width: 1.5;
        stroke-linejoin: miter;
      }
      .tech-subtle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        font-weight: 400;
        letter-spacing: 0.20em;
        fill: #64748b;
      }
      .state-box {
        fill: #111418;
        stroke: #334155;
        stroke-width: 1;
      }
      .state-header-bg {
        fill: #1a1f26;
        stroke: #334155;
        stroke-width: 1;
      }
      .state-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        fill: #ffffff;
        text-anchor: middle;
      }
      .state-action {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        fill: #f1f5f9;
      }
      .state-spec {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        font-weight: 400;
        letter-spacing: 0.01em;
        fill: #94a3b8;
      }
      .bullet-dot {
        fill: #475569;
        font-weight: bold;
      }
      .trans-line {
        stroke: #cbd5e1;
        stroke-width: 1.4;
        fill: none;
      }
      .trans-lbl {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        fill: #cbd5e1;
        text-anchor: middle;
      }
      .return-line {
        stroke: #64748b;
        stroke-width: 1.2;
        stroke-dasharray: 4 3;
        fill: none;
      }
      .return-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.20em;
        fill: #94a3b8;
      }
    </style>
    <marker id="fsm-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#cbd5e1" />
    </marker>
    <marker id="fsm-return" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Technical Chamfered Placard Frame -->
  <path d="M 28 6 L 912 6 L 934 28 L 934 216 L 912 238 L 28 238 L 6 216 L 6 28 Z" class="frame-border" />

  <!-- Top Metadata Bar -->
  <text x="28" y="22" class="tech-subtle">ESP32 FIRMWARE // FINITE STATE MACHINE (FSM)</text>
  <text x="912" y="22" class="tech-subtle" text-anchor="end">NON-BLOCKING DETERMINISTIC ENGINE</text>
  <line x1="28" y1="30" x2="912" y2="30" stroke="#22272e" stroke-width="1" />

  <!-- STATE 1: IDLE (x=28..156, w=128) -->
  <g transform="translate(28, 42)">
    <rect width="128" height="122" class="state-box" />
    <rect width="128" height="24" class="state-header-bg" />
    <text x="64" y="16" class="state-code">01 // IDLE</text>
    <text x="10" y="42" class="state-action">Standby Loop</text>
    <line x1="10" y1="50" x2="118" y2="50" stroke="#262d38" stroke-width="1" />
    <text x="10" y="68" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Drives De-energized</text>
    <text x="10" y="84" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Await CV Packet</text>
    <text x="10" y="100" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>UART Stream Active</text>
  </g>

  <!-- Transition 1 (Gap 156..218 = 62px) -->
  <text x="187" y="96" class="trans-lbl">P_target</text>
  <line x1="156" y1="105" x2="218" y2="105" class="trans-line" marker-end="url(#fsm-arrow)" />

  <!-- STATE 2: ACQUIRE (x=218..346, w=128) -->
  <g transform="translate(218, 42)">
    <rect width="128" height="122" class="state-box" />
    <rect width="128" height="24" class="state-header-bg" />
    <text x="64" y="16" class="state-code">02 // ACQUIRE</text>
    <text x="10" y="42" class="state-action">Trajectory Calc</text>
    <line x1="10" y1="50" x2="118" y2="50" stroke="#262d38" stroke-width="1" />
    <text x="10" y="68" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Compute t_run (ms)</text>
    <text x="10" y="84" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Sample P_dirty (mW)</text>
    <text x="10" y="100" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Arm Motor Timers</text>
  </g>

  <!-- Transition 2 (Gap 346..408 = 62px) -->
  <text x="377" y="96" class="trans-lbl">t_run</text>
  <line x1="346" y1="105" x2="408" y2="105" class="trans-line" marker-end="url(#fsm-arrow)" />

  <!-- STATE 3: FORWARD (x=408..536, w=128) -->
  <g transform="translate(408, 42)">
    <rect width="128" height="122" class="state-box" />
    <rect width="128" height="24" class="state-header-bg" />
    <text x="64" y="16" class="state-code">03 // FORWARD</text>
    <text x="10" y="42" class="state-action">Track Traversal</text>
    <line x1="10" y1="50" x2="118" y2="50" stroke="#262d38" stroke-width="1" />
    <text x="10" y="68" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Dual N20 FWD Run</text>
    <text x="10" y="84" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Non-blocking millis</text>
    <text x="10" y="100" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Approach Target</text>
  </g>

  <!-- Transition 3 (Gap 536..600 = 64px) -->
  <text x="568" y="96" class="trans-lbl">t &gt;= t_run</text>
  <line x1="536" y1="105" x2="600" y2="105" class="trans-line" marker-end="url(#fsm-arrow)" />

  <!-- STATE 4: CLEAN (x=600..728, w=128) -->
  <g transform="translate(600, 42)">
    <rect width="128" height="122" class="state-box" />
    <rect width="128" height="24" class="state-header-bg" />
    <text x="64" y="16" class="state-code">04 // CLEAN</text>
    <text x="10" y="42" class="state-action">Active Scrub &amp; Blast</text>
    <line x1="10" y1="50" x2="118" y2="50" stroke="#262d38" stroke-width="1" />
    <text x="10" y="68" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>25GA Roller Spin</text>
    <text x="10" y="84" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Microfiber Sweep</text>
    <text x="10" y="100" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Air Knife Engaged</text>
  </g>

  <!-- Transition 4 (Gap 728..784 = 56px) -->
  <text x="756" y="96" class="trans-lbl">Endstop</text>
  <line x1="728" y1="105" x2="784" y2="105" class="trans-line" marker-end="url(#fsm-arrow)" />

  <!-- STATE 5: DOCK (x=784..912, w=128) -->
  <g transform="translate(784, 42)">
    <rect width="128" height="122" class="state-box" />
    <rect width="128" height="24" class="state-header-bg" />
    <text x="64" y="16" class="state-code">05 // DOCK</text>
    <text x="10" y="42" class="state-action">Reverse Home</text>
    <line x1="10" y1="50" x2="118" y2="50" stroke="#262d38" stroke-width="1" />
    <text x="10" y="68" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Reverse to Origin</text>
    <text x="10" y="84" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Sample P_clean</text>
    <text x="10" y="100" class="state-spec"><tspan class="bullet-dot">&#8226; </tspan>Compute eta_gain</text>
  </g>

  <!-- Return Loop Back to Idle -->
  <path d="M 848 164 L 848 190 L 92 190 L 92 170" class="return-line" marker-end="url(#fsm-return)" />
  <rect x="340" y="181" width="260" height="18" rx="2" fill="#0c0d0e" stroke="#334155" stroke-width="1" />
  <text x="470" y="193.5" class="return-txt" text-anchor="middle">CYCLE COMPLETE // RESET TO STANDBY</text>

  <!-- Bottom Metadata Bar -->
  <line x1="28" y1="214" x2="912" y2="214" stroke="#22272e" stroke-width="1" />
  <text x="28" y="226" class="tech-subtle">HARDWARE INTERRUPTS // ASYNC LIMIT SWITCH DETECT</text>
  <text x="912" y="226" class="tech-subtle" text-anchor="end">CYCLE: DETERMINISTIC // PWR: INA219 I2C</text>
</svg>